<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жёлуди, магазин, задания, профиль — волна 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Токены: числа tokens.ts (волны 2–4) + новые волны 5 (помечены NEW) ===== */
.ph {
  --page:#FFF0DA; --sheet:#FFE3BE; --card:#FFFFFF; --sunken:#F7D5A6; --header:#F4C98E; --headerButton:rgba(255,255,255,.55);
  --text:#1E1B16; --soft:#6E6152; --muted:#A08E78; --outline:#3A2E22; --divider:rgba(58,46,34,.12);
  --accent:#4CC764; --accentLip:#34A64D; --accentSoft:#DDF5DF; --accentInk:#2E7D3E; --dangerText:#B23A3A;
  --gold:#FFCF4D; --goldLip:#D99A1E; --goldInk:#5A3A0E; --water:#3FA2DE;
  --sec:#F5D3A0; --secLip:#DDB47A; --cardLip:#E9D3B0; --skyCard:#DDF5FB; --chip:rgba(255,255,255,.7);
  --scrim:rgba(36,24,8,.34); --scrimDialog:rgba(36,24,8,.5);
  --glass:rgba(255,255,255,.92); --glassEdge:rgba(255,255,255,.9);
  --e1:0 2px 6px rgba(90,58,18,.14); --e2:0 6px 14px rgba(90,58,18,.16); --e3:0 14px 32px rgba(90,58,18,.24);
  --sheetShadow:0 -6px 24px rgba(90,58,18,.12); --shine:rgba(255,255,255,.55);
  --tintForest:#E3F4D3; --tintSettings:#F6E9D6;
  /* NEW */
  --badge:#E0485F; --goldSoft:#FFF4D6; --goldEdge:rgba(217,154,30,.45);
  --tintQuests:#FFF0C2; --tintFriends:#DDF0FB; --tintLeaders:#FFE9C7; --tintShop:#FFE1DC; --tintProfile:#ECE6FF;
}
.ph.night {
  --page:#2E2D63; --sheet:#43427A; --card:#6467B3; --sunken:#383769; --header:#34336A; --headerButton:rgba(255,255,255,.14);
  --text:#FFFFFF; --soft:#C9C8EE; --muted:#9C9BD0; --outline:#15142E; --divider:rgba(255,255,255,.12);
  --accentSoft:#2E5E55; --accentInk:#FFFFFF; --dangerText:#FF8A80; --sec:#6467B3; --secLip:#4B4E96; --cardLip:#4B4E96; --skyCard:#4A4C9A; --chip:rgba(255,255,255,.14);
  --scrim:rgba(6,6,26,.5); --scrimDialog:rgba(6,6,26,.6);
  --glass:rgba(67,66,122,.92); --glassEdge:rgba(255,255,255,.16);
  --e1:0 2px 6px rgba(5,4,26,.40); --e2:0 6px 14px rgba(5,4,26,.45); --e3:0 14px 32px rgba(5,4,26,.55);
  --sheetShadow:0 -6px 24px rgba(5,4,26,.35); --shine:rgba(255,255,255,.10);
  --tintForest:#4A6F70; --tintSettings:#55569A;
  --goldSoft:#57538F; --goldEdge:rgba(255,207,77,.45);
  --tintQuests:#5B5A9A; --tintFriends:#4A5F9A; --tintLeaders:#5E5A92; --tintShop:#5F5294; --tintProfile:#55569A;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#EFE3CF; font-family:'Nunito',system-ui,sans-serif; font-weight:700; color:#1E1B16; }
.intro { max-width:980px; margin:32px auto 8px; padding:0 16px; }
.intro h1 { font-weight:900; font-size:30px; }
.intro p { color:#6E6152; margin-top:6px; line-height:1.45; }
.group { max-width:1700px; margin:28px auto 0; padding:0 16px; font-weight:900; font-size:20px; color:#5A3A0E; }
.list { display:flex; flex-wrap:wrap; gap:36px 28px; justify-content:center; padding:20px 16px 40px; }
.cell .cap { margin-top:10px; max-width:375px; }
.cap b { font-weight:900; font-size:17px; display:block; }
.cap span { color:#6E6152; font-size:13.5px; line-height:1.4; display:block; margin-top:3px; }
.ph { position:relative; overflow:hidden; border-radius:40px; box-shadow:0 18px 40px rgba(60,40,10,.18),0 0 0 1px rgba(0,0,0,.06); background:var(--page); color:var(--text); font-variant-numeric:tabular-nums; }
.ph.sheetbg { border-radius:24px; }
body.single { background:transparent; }
body.single .ph { border-radius:0; box-shadow:none; }
.abs { position:absolute; }
.bg { position:absolute; left:0; top:0; display:block; }
.scrim { position:absolute; inset:0; background:var(--scrim); }
.scrimD { position:absolute; inset:0; background:var(--scrimDialog); }
svg { display:block; overflow:visible; }

/* ===== Жёлуди: плашка ===== */
.wallet { position:absolute; height:34px; border-radius:17px; background:var(--glass); border:1px solid var(--glassEdge); box-shadow:var(--e1); display:flex; align-items:center; gap:5px; padding:0 12px 0 7px; font-weight:900; font-size:16px; line-height:22px; white-space:nowrap; z-index:30; }
.wallet.compact { height:30px; border-radius:15px; padding:0 10px 0 6px; font-size:15px; gap:4px; }
.wallet .num { display:inline-block; }
.plus { position:absolute; height:22px; border-radius:11px; padding:0 8px; background:var(--accent); color:#fff; font-weight:900; font-size:13px; line-height:20px; border:2px solid #fff; z-index:31; box-shadow:var(--e1); }
.minus { background:#B08A5A; }
.hearts { position:absolute; height:28px; border-radius:14px; background:#58D46A; display:flex; align-items:center; gap:2px; padding:0 7px; box-shadow:var(--e1); z-index:5; }
.fly { position:absolute; z-index:40; }

/* ===== Шапка дерева (как в кадрах волны 4) ===== */
.h1 { position:absolute; left:24px; right:24px; text-align:center; font-weight:900; font-size:18px; line-height:24px; }
.h2 { position:absolute; left:24px; right:24px; text-align:center; font-weight:700; font-size:14px; line-height:20px; color:var(--soft); }
.night .h1 { text-shadow:0 1px 2px rgba(0,0,0,.25); }

/* ===== Плашка (лист) ===== */
.sheet { position:absolute; left:0; right:0; height:1400px; background:var(--sheet); border:1.5px solid var(--outline); border-bottom:0; border-radius:32px 32px 0 0; box-shadow:var(--sheetShadow), inset 0 1px 0 var(--shine); padding-top:8px; z-index:20; }
.grab { height:20px; display:flex; justify-content:center; align-items:center; gap:0; position:relative; }
.grab i { width:19px; height:5px; border-radius:3px; background:var(--card); display:block; }
.grab i + i { margin-left:-2px; }
.grab .dot { position:absolute; left:calc(50% + 26px); top:5px; width:9px; height:9px; border-radius:50%; background:var(--badge); border:2px solid var(--sheet); }
.status { text-align:center; padding:2px 16px 0; }
.status .l1 { display:flex; justify-content:center; align-items:center; gap:6px; font-weight:800; font-size:16px; line-height:22px; color:var(--accentLip); }
.night .status .l1 { color:#7BE08C; }
.status .l2 { display:flex; justify-content:center; align-items:center; gap:5px; font-weight:700; font-size:14px; line-height:20px; color:var(--soft); margin-top:2px; }
.days { display:flex; gap:10px; justify-content:center; padding:16px 0 0; }
.day { width:64px; height:80px; border-radius:16px; background:var(--card); box-shadow:var(--e1); display:flex; flex-direction:column; align-items:center; padding-top:7px; }
.day .w { font-size:12px; font-weight:800; line-height:16px; color:var(--soft); }
.day .n { font-size:22px; font-weight:900; line-height:26px; }
.day.today { outline:3px solid var(--accent); outline-offset:-3px; }
.day.fut { opacity:.5; }
.lockrow { display:flex; justify-content:center; align-items:center; gap:6px; height:36px; font-weight:800; font-size:14px; color:var(--soft); margin-top:6px; }

/* ===== Меню ===== */
.menu { padding:0 16px; }
.menu .div { height:1px; background:var(--divider); margin-bottom:16px; }
.mrow { display:flex; gap:10px; }
.mcard { flex:1; position:relative; border-radius:20px; background:var(--cardLip); box-shadow:var(--e1); }
.mcard .face { position:absolute; left:0; right:0; top:0; bottom:3px; border-radius:20px; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 6px; }
.mcard.acc { background:var(--accentLip); } .mcard.acc .face { background:var(--accent); color:#fff; }
.mcard .circ { width:48px; height:48px; border-radius:24px; display:flex; align-items:center; justify-content:center; }
.mcard .t { font-weight:800; font-size:14px; line-height:17px; text-align:center; margin-top:4px; }
.mcard .c { font-weight:700; font-size:11.5px; line-height:13px; color:var(--soft); text-align:center; white-space:nowrap; }
.mcard.wide .face { flex-direction:row; justify-content:flex-start; gap:10px; padding:0 10px 0 12px; }
.mcard.wide .circ { width:44px; height:44px; }
.mcard.wide .tx { display:flex; flex-direction:column; min-width:0; }
.mcard.wide .t { text-align:left; margin-top:0; font-size:15px; line-height:19px; }
.mcard.wide .c { text-align:left; font-size:12px; line-height:15px; overflow:hidden; text-overflow:ellipsis; }
.mcard.wide .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mcard.narrow .face { justify-content:flex-start; padding-top:9px; }
.mcard.narrow .circ { width:40px; height:40px; }
.mcard.narrow .t { font-size:13px; line-height:16px; margin-top:3px; }
.nb { position:absolute; top:-5px; right:-5px; min-width:22px; height:22px; border-radius:11px; padding:0 6px; background:var(--badge); color:#fff; font-weight:900; font-size:12px; line-height:18px; text-align:center; border:2px solid var(--sheet); z-index:3; }
.nb.dot { min-width:14px; width:14px; height:14px; padding:0; top:-3px; right:-3px; }

/* ===== Кнопки, сегменты, общие ===== */
.btn { position:relative; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; white-space:nowrap; }
.btn.L { height:56px; border-radius:16px; font-size:18px; }
.btn.M { height:48px; border-radius:14px; font-size:16px; }
.btn.S { height:36px; border-radius:12px; font-size:14px; padding:0 12px; gap:5px; }
.btn.primary { background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accentLip); }
.btn.gold { background:var(--gold); color:var(--goldInk); box-shadow:0 4px 0 var(--goldLip); }
.btn.secondary { background:var(--sec); color:var(--text); box-shadow:0 4px 0 var(--secLip); }
.btn.S.primary, .btn.S.gold, .btn.S.secondary { box-shadow:0 3px 0 var(--accentLip); }
.btn.S.gold { box-shadow:0 3px 0 var(--goldLip); }
.btn.off { background:var(--sunken); color:var(--muted); box-shadow:none; }
.btn.text { background:none; color:var(--soft); box-shadow:none; }
.btn.pressed { transform:translateY(3px); box-shadow:0 1px 0 var(--accentLip); }
.btn.gold.pressed { box-shadow:0 1px 0 var(--goldLip); }
.seg { height:44px; border-radius:14px; background:var(--sunken); padding:4px; display:flex; position:relative; }
.seg div { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; font-weight:800; font-size:15px; color:var(--soft); border-radius:11px; position:relative; z-index:1; }
.seg div.on { background:var(--card); color:var(--text); box-shadow:var(--e1); }
.pbar { height:8px; border-radius:4px; background:var(--sunken); overflow:hidden; }
.pbar i { display:block; height:100%; border-radius:4px; background:var(--accent); }
.micro { font-weight:900; font-size:10px; line-height:12px; letter-spacing:.6px; text-transform:uppercase; }
.cap12 { font-weight:800; font-size:12px; line-height:16px; }
.small { font-weight:700; font-size:14px; line-height:20px; }
.soft { color:var(--soft); }
.t3 { font-weight:900; font-size:18px; line-height:24px; }
.t2 { font-weight:900; font-size:22px; line-height:28px; }
.bs { font-weight:800; font-size:16px; line-height:22px; }

/* ===== Страница ===== */
.pbarTop { position:absolute; left:0; right:0; top:0; height:56px; background:var(--header); border-radius:0 0 24px 24px; box-shadow:var(--e1); display:flex; align-items:center; justify-content:center; z-index:10; }
.pbarTop .tt { font-weight:900; font-size:22px; line-height:28px; }
.back { position:absolute; left:12px; top:8px; width:40px; height:40px; border-radius:20px; background:var(--headerButton); display:flex; align-items:center; justify-content:center; }

/* ===== Магазин ===== */
.grid { position:absolute; left:16px; right:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.scard { position:relative; height:216px; border-radius:20px; background:var(--cardLip); box-shadow:var(--e1); }
.scard .face { position:absolute; inset:0 0 3px 0; border-radius:20px; background:var(--card); padding:6px; }
.scard .pv { height:132px; border-radius:15px; overflow:hidden; position:relative; }
.scard .nm { font-weight:900; font-size:16px; line-height:22px; margin:9px 6px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scard .pr { margin:6px 6px 0; }
.scard.sel { box-shadow:0 0 0 3px var(--accent), var(--e1); }
.price { display:inline-flex; align-items:center; gap:4px; height:28px; border-radius:14px; padding:0 10px 0 6px; background:var(--sunken); font-weight:900; font-size:15px; }
.price.poor .n { color:var(--soft); opacity:.7; }
.own { display:inline-flex; align-items:center; gap:4px; height:28px; border-radius:14px; padding:0 10px 0 5px; background:var(--accentSoft); color:var(--accentInk); font-weight:900; font-size:14px; }
.selp { display:inline-flex; align-items:center; gap:4px; height:28px; border-radius:14px; padding:0 10px 0 5px; background:var(--accent); color:#fff; font-weight:900; font-size:14px; }
.newtag { position:absolute; left:8px; top:8px; height:20px; border-radius:8px; padding:0 7px; background:var(--gold); color:var(--goldInk); display:flex; align-items:center; z-index:2; }
.earn { position:absolute; left:16px; right:16px; border-radius:20px; background:var(--card); box-shadow:var(--e1); padding:14px 16px 6px; }
.erow { display:flex; align-items:center; gap:12px; height:40px; border-top:1px solid var(--divider); }
.erow:first-of-type { border-top:0; }
.erow .x { flex:1; font-weight:700; font-size:14px; line-height:18px; }
.erow .a { display:flex; align-items:center; gap:3px; font-weight:900; font-size:14px; }

/* окно товара */
.ipv { position:relative; height:248px; border-radius:24px; overflow:hidden; margin:4px 16px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04); }
.stages { display:flex; justify-content:space-between; margin:12px 16px 0; }
.st { width:48px; height:48px; border-radius:12px; background:var(--sunken); overflow:hidden; display:flex; align-items:flex-end; justify-content:center; }
.st.on { background:var(--card); box-shadow:0 0 0 2px var(--accent), var(--e1); }
.dn { position:absolute; right:10px; top:10px; height:32px; border-radius:16px; background:var(--glass); box-shadow:var(--e1); display:flex; padding:3px; gap:2px; }
.dn i { width:30px; height:26px; border-radius:13px; display:flex; align-items:center; justify-content:center; }
.dn i.on { background:var(--accent); }
.ribbon { position:absolute; left:50%; transform:translateX(-50%); height:40px; padding:0 26px; background:linear-gradient(#FFD866,#F0B53A); color:#5A3A0E; font-weight:900; font-size:18px; line-height:40px; border-radius:6px; box-shadow:0 3px 0 #B9801E, 0 8px 18px rgba(90,58,18,.25); z-index:5; white-space:nowrap; }
.ribbon:before, .ribbon:after { content:''; position:absolute; top:10px; width:18px; height:30px; background:#D9962A; z-index:-1; }
.ribbon:before { left:-12px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%); }
.ribbon:after { right:-12px; clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%); }
.rays { position:absolute; left:50%; top:50%; width:420px; height:420px; margin:-210px 0 0 -210px; background:repeating-conic-gradient(from 0deg, rgba(255,231,160,.55) 0deg 9deg, rgba(255,231,160,0) 9deg 30deg); border-radius:50%; -webkit-mask:radial-gradient(closest-side, #000 30%, transparent 100%); mask:radial-gradient(closest-side, #000 30%, transparent 100%); }

/* ===== Задания ===== */
.qcard { position:relative; display:flex; align-items:center; gap:12px; height:76px; border-radius:20px; background:var(--card); box-shadow:var(--e1); margin:0 16px 10px; padding:0 12px; }
.qcard .gc { width:44px; height:44px; border-radius:22px; background:var(--tintQuests); display:flex; align-items:center; justify-content:center; flex:none; }
.qcard .mid { flex:1; min-width:0; }
.qcard .qt { font-weight:800; font-size:15px; line-height:19px; }
.qcard .qp { display:flex; align-items:center; gap:8px; margin-top:6px; }
.qcard .qp .pbar { flex:1; }
.qcard .qp b { font-weight:800; font-size:12px; color:var(--soft); }
.qcard.ready { box-shadow:0 0 0 2px var(--accent), var(--e1); }
.qcard.done .qt { color:var(--soft); }
.qcard.done { background:color-mix(in srgb, var(--card) 60%, var(--sheet)); box-shadow:none; }
.rew { display:inline-flex; align-items:center; gap:3px; height:28px; border-radius:14px; padding:0 9px 0 5px; background:var(--sunken); font-weight:900; font-size:14px; color:var(--soft); flex:none; }
.bonus { position:relative; display:flex; align-items:center; gap:12px; height:84px; border-radius:20px; background:var(--goldSoft); border:1.5px solid var(--goldEdge); margin:4px 16px 0; padding:0 12px; }
.dots3 { display:flex; gap:6px; margin-top:6px; }
.dots3 i { width:10px; height:10px; border-radius:5px; background:var(--sunken); }
.dots3 i.on { background:var(--accent); }

/* ===== Профиль ===== */
.av { border-radius:50%; overflow:hidden; position:relative; flex:none; }
.stat { border-radius:16px; background:var(--card); box-shadow:var(--e1); padding:10px 10px 8px; height:86px; }
.stat .v { font-weight:900; font-size:22px; line-height:26px; margin-top:4px; }
.stat .l { font-weight:800; font-size:11.5px; line-height:14px; color:var(--soft); }
.awards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 8px; }
.aw { display:flex; flex-direction:column; align-items:center; position:relative; }
.aw .an { font-weight:800; font-size:12px; line-height:15px; text-align:center; margin-top:6px; height:30px; overflow:hidden; }
.aw .ap { font-weight:800; font-size:11px; color:var(--soft); }
.grp { border-radius:20px; background:var(--card); box-shadow:var(--e1); }
.row { display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 16px; }
.sq { width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
.field { height:56px; border-radius:16px; background:var(--card); border:2px solid var(--accent); box-shadow:var(--e1); display:flex; align-items:center; padding:0 12px 0 14px; font-weight:800; font-size:18px; }
.cdot { width:36px; height:36px; border-radius:18px; flex:none; }
.cdot.on { box-shadow:0 0 0 2px var(--sheet), 0 0 0 4.5px var(--accent); }
.toast { position:absolute; left:16px; right:16px; height:64px; border-radius:20px; background:var(--card); box-shadow:var(--e3); display:flex; align-items:center; gap:12px; padding:0 14px 0 10px; z-index:50; }
.dialog { position:absolute; left:24px; right:24px; border-radius:28px; background:var(--card); border:1.5px solid var(--outline); box-shadow:var(--e3); padding:76px 24px 12px; text-align:center; z-index:40; }

/* ===== Листы-шпаргалки ===== */
.sheetbg { background:#FFF8EC; padding:20px; color:#1E1B16; }
.sheetbg.night { background:#2E2D63; color:#fff; }
.sheetbg h3 { font-weight:900; font-size:18px; margin:0 0 10px; }
.sheetbg .lab { font-size:12px; font-weight:800; color:#6E6152; text-align:center; margin-top:4px; }
.sheetbg.night .lab { color:#C9C8EE; }
</style>
</head>

<div id="root"></div>
<script src="макет-магазин-рисунки.js"></script>
<script>
/* ======== Старые глифы (glyphs.tsx, без изменений) ======== */
const OLD = {
 "rings": "<circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"#7A4E26\" /> <circle cx=\"12\" cy=\"12\" r=\"9.2\" fill=\"#F3CF92\" /> <circle cx=\"11.6\" cy=\"12.3\" r=\"6.4\" fill=\"none\" stroke=\"#B57A3E\" stroke-width=\"1.8\" /> <circle cx=\"11.35\" cy=\"12.45\" r=\"3.4\" fill=\"none\" stroke=\"#B57A3E\" stroke-width=\"1.8\" /> <circle cx=\"11\" cy=\"12.7\" r=\"1.2\" fill=\"#9A6230\" />",

function badge(a, state = 'got', size = 64) {
  const [id, , , reward, mark, disc] = a;
  const [face, lip, shine] = TIER[tierOf(reward)];
  const locked = state === 'locked' || String(state).startsWith('progress');
  const p = String(state).startsWith('progress') ? +String(state).split(':')[1] : 0;

  const ring = p ? `<circle cx="32" cy="32" r="31" fill="none" stroke="var(--sunken)" stroke-width="3.5"/><circle cx="32" cy="32" r="31" fill="none" stroke="#4CC764" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(p * 194.8).toFixed(1)} 300" transform="rotate(-90 32 32)"/>` : '';
  const glow = state === 'claim' ? `<circle cx="32" cy="31" r="34" fill="url(#bglow)"/>` : '';

    <circle cx="32" cy="33.5" r="27" fill="${l}"/><circle cx="32" cy="31" r="27" fill="${f}"/>${center}
    <path d="M14 22 A20 20 0 0 1 24 12.6" fill="none" stroke="${locked ? '#FFF6E6' : shine}" stroke-width="2.6" stroke-linecap="round" opacity=".8"/></svg>`;
}

const bgImg = (src, w = 375, h = 812) => `<img class="bg" src="${src}" width="${w}" height="${h}">`;
const counterRow = (n, y = 56) => `<div class="abs" style="left:0;right:0;top:${y}px;display:flex;justify-content:center;align-items:center;gap:8px;height:52px">${glyph('rings', 40)}<span style="font-weight:900;font-size:46px;line-height:52px;letter-spacing:-.5px">${n}</span></div>`;
const NAMES = { birch: ['Берёза', 'Birch'], maple: ['Клён', 'Maple'], apple: ['Яблоня', 'Apple tree'], palm: ['Пальма', 'Palm'], oak: ['Дуб', 'Oak'], sakura: ['Сакура', 'Sakura'], spruce: ['Ёлка', 'Spruce'] };
const PNG = { oak: 'oak-tree', sakura: 'sakura-tree', spruce: 'spruce-tree' };
/** Превью дерева в карточке (стадия «дерево»). */
function treeThumb(kind, w, h, night, meadow = 'summer') {
  const size = Math.min(w * 0.92, h * 0.98 * 300 / 320);
  const tree = PNG[kind]
    ? `<img src="../волна-2/img/${PNG[kind]}.png" style="position:absolute;left:50%;bottom:${h * 0.16}px;transform:translateX(-50%);height:${h * 0.78}px">`
    : `<div style="position:absolute;left:50%;bottom:${h * 0.13}px;transform:translateX(-50%)">${treeSVG(kind, 'tree', { night, size, fill: 0.82 })}</div>`;
  return `<div style="position:absolute;inset:0">${sceneSVG(meadow, { W: w, H: h, night, horizon: 0.66, sun: false, front: false, weather: false })}</div>${tree}`;
}

    <div class="mrow" style="height:${h3}px;margin-top:10px">${card(T.shop, '', 'shop', 'var(--tintShop)', 26, shopDot ? '<div class="nb dot"></div>' : '', 'narrow')}${card(T.prof, '', 'profile', 'var(--tintProfile)', 26, nb(profBadge), 'narrow')}${card(T.set, '', 'settings', 'var(--tintSettings)', 25, '', 'narrow')}</div></div>`;
}

/* ---- Задания ---- */
const Q = {
  waterAll: ['drop', 'Полей все деревья', 'Water all your trees'],
  visitForest: ['forest', 'Загляни в «Мой лес»', 'Visit My forest'],
  nameTree: ['nameTag', 'Дай имя дереву', 'Name a tree'],
  moveTree: ['plot', 'Переставь дерево в лесу', 'Move a tree in your forest'],
  visitFriend: ['friends', 'Загляни к другу', 'Visit a friend'],
  cheerFriend: ['heart', 'Подбодри друга', 'Cheer a friend on'],
  plantHabit: ['newHabit', 'Посади новую привычку', 'Plant a new habit'],
  waterShared: ['drop', 'Полей общее дерево с другом', 'Water the tree you share'],
};
function qcard(id, st, { p = null, en = false } = {}) {
  const [g, ru, eng] = Q[id];
  const t = en ? eng : ru;
  const right = st === 'ready' ? btn('primary', 'S', en ? 'Claim' : 'Забрать', glyph('acorn', 18)) :
    st === 'done' ? `<div class="cap12 soft" style="display:flex;align-items:center;gap:4px">${en ? 'Done' : 'Готово'}</div>` :
    st === 'press' ? btn('primary', 'S', en ? 'Claim' : 'Забрать', glyph('acorn', 18), 'transform:scale(.94) translateY(2px);box-shadow:0 1px 0 #34A64D') :
    `<span class="rew">${glyph('acorn', 18)}+10</span>`;
  const circ = st === 'done' ? `<div class="gc" style="background:transparent">${glyph('check', 30)}</div>` : `<div class="gc">${glyph(g, 28)}</div>`;
  const prog = p ? `<div class="qp"><div class="pbar"><i style="width:${(p[0] / p[1]) * 100}%"></i></div><b>${p[0]} / ${p[1]}</b></div>` : '';
  return `<div class="qcard ${st === 'ready' || st === 'press' ? 'ready' : st}">${circ}<div class="mid"><div class="qt">${t}</div>${prog}</div>${right}${st === 'todo' ? `<span style="margin-left:-6px;opacity:.6">${icon('chevronRight', 16, 'var(--soft)', 2.6)}</span>` : ''}</div>`;
}
function bonus(n, st, en = false) {
  const right = st === 'ready' ? btn('gold', 'S', en ? 'Claim +15' : 'Забрать +15', '') : st === 'done' ? `<div class="cap12 soft">${en ? 'Done' : 'Готово'}</div>` : `<span class="rew">${glyph('acorn', 18)}+15</span>`;
  return `<div class="bonus">${glyph('basket', st === 'ready' ? 52 : 46)}<div style="flex:1"><div class="qt" style="font-weight:800;font-size:15px;line-height:19px">${en ? 'All three — a basket of acorns' : 'Все три — корзинка желудей'}</div><div class="dots3">${[0, 1, 2].map((i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div></div>${right}</div>`;
}
function questsSheet(top, cards, bon, { en = false, allDone = false, timer = '5 ч 12 мин' } = {}) {
  const head = allDone
    ? `<div style="text-align:center;padding:2px 16px 14px"><div style="display:flex;justify-content:center;position:relative">${glyph('basket', 64)}${glyph('sparkle', 16, 'style="position:absolute;left:calc(50% + 30px);top:2px"')}${glyph('sparkle', 12, 'style="position:absolute;left:calc(50% - 44px);top:20px"')}</div><div class="t2" style="margin-top:6px">${en ? 'All done!' : 'Всё сделано!'}</div><div class="small soft" style="display:flex;justify-content:center;align-items:center;gap:5px;margin-top:2px">${icon('clock', 16, 'var(--soft)')}${en ? 'New quests in ' + timer : 'Новые задания через ' + timer}</div></div>`
    : `<div style="padding:4px 16px 14px"><div class="t2">${en ? 'Today’s quests' : 'Задания на сегодня'}</div><div class="small soft" style="display:flex;align-items:center;gap:5px;margin-top:2px">${icon('clock', 16, 'var(--soft)')}${en ? 'New ones in ' + timer : 'Новые через ' + timer}</div></div>`;
  return sheet(top, grab() + head + cards + bon + `<div class="cap12 soft" style="text-align:center;margin-top:14px">${en ? 'Quests count by themselves as you go.' : 'Задания засчитываются сами, по ходу дня.'}</div>`);
}

frame('13', 'Задания', 'Всё забрано', 'Сверху — корзинка и «Всё сделано!» с таймером. Таймер обновляется раз в минуту; меньше часа — «через 42 мин».', () =>

/* ---- Магазин ---- */
function pageBar(title, right = '') {
  return `<div class="pbarTop"><div class="back">${icon('chevronLeft', 22, 'var(--text)', 2.6)}</div><div class="tt">${title}</div>${right}</div>`;

function shopCard(kind, state, { night = false, en = false, meadow = 'summer', isMeadow = false, price = 0, poor = false, top = 0 } = {}) {
  const pv = isMeadow ? `<div style="position:absolute;inset:0">${sceneSVG(kind, { W: 154, H: 132, night, horizon: 0.5, tree: treeSVG('birch', 'young', { night, size: 70 }).replace(/<svg[^>]*>/, '<svg width="70" height="75" viewBox="0 0 300 320">'), treeW: 0.46, sun: true, front: true })}</div>` : treeThumb(kind, 154, 132, night, meadow);
  const label = state === 'sel' ? `<span class="selp">${glyph('check', 20)}${en ? 'Selected' : 'Выбран'}</span>` : state === 'own' ? `<span class="own">${icon('check', 18, 'currentColor', 2.8)}${en ? 'Owned' : 'Есть'}</span>` : `<span class="price${poor ? ' poor' : ''}">${glyph('acorn', 20)}<span class="n">${fmt(price, en)}</span></span>`;
  const nm = isMeadow ? (en ? { summer: 'Summer', autumn: 'Autumn', winter: 'Winter', bloom: 'Blossom' }[kind] : { summer: 'Летний', autumn: 'Осенний', winter: 'Зимний', bloom: 'Цветочный' }[kind]) : NAMES[kind][en ? 1 : 0];
  return `<div class="scard${state === 'sel' ? ' sel' : ''}"><div class="face"><div class="pv">${pv}</div><div class="nm">${nm}</div><div class="pr">${label}</div></div></div>`;
}
function earnCard(top, en = false) {
  const rows = en ? [['drop', 'Water a tree (up to 3 a day)', '+5'], ['stageUp', 'A new stage', '+10…150'], ['tasks', 'Daily quests', '+10'], ['basket', 'All three quests', '+15'], ['plaque', 'Achievements', '+20…200']]
    : [['drop', 'Полив (до 3 деревьев в день)', '+5'], ['stageUp', 'Новая стадия дерева', '+10…150'], ['tasks', 'Задание дня', '+10'], ['basket', 'Все три задания', '+15'], ['plaque', 'Награды в профиле', '+20…200']];
  return `<div class="earn" style="top:${top}px"><div class="t3" style="display:flex;align-items:center;gap:8px;margin-bottom:4px">${glyph('acorn', 24)}${en ? 'How to earn acorns' : 'Как заработать жёлуди'}</div>${rows.map(([g, t, a]) => `<div class="erow">${glyph(g, 24)}<div class="x">${t}</div><div class="a">${a}</div></div>`).join('')}</div>`;
}
function shopPage({ tab = 'trees', night = false, en = false, n = 320, scroll = 0 } = {}) {
  const segs = en ? ['Trees', 'Meadows'] : ['Деревья', 'Луга'];
  let grid;
  if (tab === 'trees') {
    const items = [['birch', 'own'], ['maple', 'buy', 400], ['apple', 'buy', 600], ['palm', 'buy', 900], ['oak', 'own'], ['sakura', 'own'], ['spruce', 'own']];
    grid = items.map(([k, st, p]) => shopCard(k, st, { night, en, price: p, poor: p > n })).join('');
  } else {
    grid = [['summer', 'sel'], ['autumn', 'buy', 500], ['winter', 'own'], ['bloom', 'buy', 1200]].map(([k, st, p]) => shopCard(k, st, { night, en, isMeadow: true, price: p, poor: p > n })).join('');
  }
  return `<div class="abs" style="left:0;right:0;top:${-scroll}px">` +
    `<div class="seg abs" style="left:16px;right:16px;top:72px">${segs.map((s, i) => `<div class="${(i === 0) === (tab === 'trees') ? 'on' : ''}">${glyph(i ? 'plot' : 'forest', 20)}${s}</div>`).join('')}</div>` +
    `<div class="grid" style="top:132px">${grid}</div>` + (tab === 'meadows' ? earnCard(132 + 2 * 228 + 8, en) : earnCard(132 + 4 * 228 + 8, en)) + `</div>` +

  }[isMeadow ? meadow : kind];

/* ======== Сборка ======== */
const params = new URLSearchParams(location.search);
const only = params.get('f');
const root = document.getElementById('root');
if (only) {
  document.body.classList.add('single');
  const f = FR.find((x) => x.id === only);
  root.innerHTML = `<div class="ph ${f.night ? 'night' : ''} ${f.cls}" style="width:${f.w}px;height:${f.h}px">${f.render()}</div>`;
} else {
  let html = `<div class="intro"><h1>Волна 5: жёлуди, магазин, задания, профиль</h1><p>Кадры к «спец-магазин.md». Один кадр — ?f=01 … ?f=34. Сцена главного — снимки v0.9 (вырезы iPhone не учтены: в приложении всё сдвигается на insets.top). Деревья и луга нарисованы кодом файла «макет-магазин-рисунки.js» — это эскиз будущего Skia.</p></div>`;
  let g = '';
  for (const f of FR) {
    if (f.group !== g) { if (g) html += '</div>'; g = f.group; html += `<div class="group">${g}</div><div class="list">`; }
    html += `<div class="cell"><div class="ph ${f.night ? 'night' : ''} ${f.cls}" style="width:${f.w}px;height:${f.h}px">${f.render()}</div><div class="cap"><b>${f.id} · ${f.title}</b><span>${f.sub}</span></div></div>`;
  }
  root.innerHTML = html + '</div>';
}
window.FRAMES = FR.map((f) => [f.id, f.title, f.w, f.h]);
