<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лес в аккаунте — OYUUR-29</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: the same as design/волна-5/макет-друзья.html (tokens.ts) + new ones of спец.md, section 8.1 ===== */
.ph {
  --page:#FFF0DA; --sheet:#FFE3BE; --card:#FFFFFF; --sunken:#F7D5A6; --header:#F4C98E; --headerBtn:rgba(255,255,255,.55);
  --text:#1E1B16; --soft:#6E6152; --muted:#A08E78; --outline:#3A2E22; --divider:rgba(58,46,34,.12);
  --accent:#4CC764; --accentLip:#34A64D; --accentSoft:#DDF5DF; --dangerText:#B23A3A;
  --gold:#FFCF4D; --goldLip:#D99A1E; --goldInk:#5A3A0E; --goldSoft:#FFF4D6; --goldEdge:rgba(217,154,30,.45);
  --water:#3FA2DE; --waterSoft:#DCEFFB; --waterInk:#2479B5; --doneInk:#2E8B45;
  --sec:#F5D3A0; --secLip:#DDB47A; --skyCard:#DDF5FB;
  --warm:#FFB46B; --warmLip:#E5873A; --warmInk:#4A2308; --warmSoft:#FFE9D3;
  --scrim:rgba(36,24,8,.34); --scrimDialog:rgba(36,24,8,.5); --glass:rgba(255,255,255,.92);
  --e1:0 2px 6px rgba(90,58,18,.14); --e2:0 6px 14px rgba(90,58,18,.16); --e3:0 14px 32px rgba(90,58,18,.24);
  --sheetShadow:0 -6px 24px rgba(90,58,18,.12);
  /* new (спец.md 8.1) */
  --vault:#C68A58; --vaultLip:#7A4E26;
  --pick:#E9F8EA; --pickEdge:#4CC764;
  --meadowStrip:#DCE3A0;
  --treeFilter:none;
  --softC:#6E6152;
}
.ph.night {
  --page:#2E2D63; --sheet:#43427A; --card:#6467B3; --sunken:#383769; --header:#34336A; --headerBtn:rgba(255,255,255,.14);
  --text:#FFFFFF; --soft:#C9C8EE; --muted:#9C9BD0; --outline:#15142E; --divider:rgba(255,255,255,.12);
  --accentSoft:#2E5E55; --dangerText:#FF8A80; --waterSoft:#34508A; --waterInk:#9AD3FF; --doneInk:#8BE39B;
  --goldSoft:#57538F; --goldEdge:rgba(255,207,77,.45);
  --sec:#6467B3; --secLip:#4B4E96; --skyCard:#4A4C9A; --warmSoft:#5E4B78;
  --scrim:rgba(6,6,26,.5); --scrimDialog:rgba(6,6,26,.6); --glass:rgba(67,66,122,.92);
  --e1:0 2px 6px rgba(5,4,26,.40); --e2:0 6px 14px rgba(5,4,26,.45); --e3:0 14px 32px rgba(5,4,26,.55);
  --sheetShadow:0 -6px 24px rgba(5,4,26,.35);
  --pick:#3B5F6E; --pickEdge:#4CC764;
  --meadowStrip:#45507A;
  --treeFilter:brightness(.78) saturate(.8) hue-rotate(10deg);
  /* text on night cards (#6467B3): 4.55:1, спец 8.1 */
  --softC:#F2F1FF;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#EFE3CF; font-family:'Nunito',system-ui,sans-serif; font-weight:700; color:#1E1B16; }
.intro { max-width:960px; margin:32px auto 8px; padding:0 16px; }
.intro h1 { font-weight:900; font-size:30px; }
.intro p { color:#6E6152; margin-top:6px; line-height:1.45; }
.group { max-width:1700px; margin:28px auto 0; padding:0 16px; font-weight:900; font-size:20px; color:#5A3A0E; }
.list { display:flex; flex-wrap:wrap; gap:36px 28px; justify-content:center; padding:20px 16px 40px; }
.cell { width:375px; } .cell.wide { width:780px; }
.cap { margin-top:10px; }
.cap b { font-weight:900; font-size:17px; display:block; }
.cap span { color:#6E6152; font-size:13.5px; line-height:1.4; display:block; margin-top:3px; }
.ph { position:relative; overflow:hidden; border-radius:40px; box-shadow:0 18px 40px rgba(60,40,10,.18),0 0 0 1px rgba(0,0,0,.06); background:var(--page); color:var(--text); }
body.single { background:transparent; overflow:hidden; }
html:has(body.single) { overflow:hidden; }
body.single .ph { border-radius:0; box-shadow:none; }
.abs { position:absolute; }
.row { display:flex; align-items:center; }
.ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.note { position:absolute; z-index:90; background:#5A3A0E; color:#FFF3C4; font-weight:800; font-size:11px; line-height:14px; padding:3px 7px; border-radius:6px; white-space:nowrap; }

.sbar { position:absolute; top:0; left:0; right:0; height:47px; display:flex; justify-content:space-between; align-items:center; padding:0 30px 0 36px; font-weight:800; font-size:15px; z-index:70; color:var(--text); }
.sbar.light { color:#1E1B16; }
.homei { position:absolute; bottom:8px; left:50%; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:var(--text); opacity:.85; z-index:80; }
.pbar { position:absolute; top:0; left:0; right:0; background:var(--header); border-radius:0 0 24px 24px; box-shadow:var(--e1); z-index:40; }
.pbar h2 { position:absolute; left:64px; right:64px; text-align:center; font-weight:900; font-size:22px; line-height:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pbtn { position:absolute; width:40px; height:40px; border-radius:20px; background:var(--headerBtn); display:flex; align-items:center; justify-content:center; }
.content { position:absolute; left:16px; right:16px; }
.gcap { font-weight:900; font-size:12px; line-height:16px; letter-spacing:.8px; text-transform:uppercase; color:var(--soft); margin:20px 0 8px 6px; }
.card { background:var(--card); border-radius:20px; box-shadow:var(--e1); }
.grp { background:var(--card); border-radius:20px; box-shadow:var(--e1); overflow:hidden; }
.grow2 { min-height:56px; padding:12px 16px; display:flex; align-items:center; gap:12px; position:relative; }
.sq { width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
.div { height:1px; background:var(--divider); margin-left:60px; }
.tog { width:52px; height:32px; border-radius:16px; background:var(--accent); position:relative; flex:none; }
.tog::after { content:''; position:absolute; top:3px; left:23px; width:26px; height:26px; border-radius:13px; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.18); }

.btn { display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; position:relative; white-space:nowrap; }
.btn.L { height:56px; font-size:18px; border-radius:16px; }
.btn.M { height:48px; font-size:16px; border-radius:14px; }
.btn.S { height:36px; font-size:14px; border-radius:12px; padding:0 12px; }
.btn.pri { background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accentLip); }
.btn.sec { background:var(--sec); color:var(--text); box-shadow:0 4px 0 var(--secLip); }
.btn.dng { background:#D24A43; color:#fff; box-shadow:0 4px 0 #A3332D; }
.btn.done { background:var(--sunken); color:var(--soft); box-shadow:none; }
.btn.txt { background:none; color:var(--soft); box-shadow:none; }
.btn.S.pri { box-shadow:0 3px 0 var(--accentLip); }
.btn.S.sec { box-shadow:0 3px 0 var(--secLip); }
.sticky { position:absolute; left:0; right:0; bottom:0; padding:34px 16px 40px; background:linear-gradient(to bottom, rgba(0,0,0,0), var(--page) 34px); z-index:30; }

.scrim { position:absolute; inset:0; background:var(--scrim); z-index:55; }
.scrimD { position:absolute; inset:0; background:var(--scrimDialog); z-index:55; }
.dialog { position:absolute; left:24px; right:24px; background:var(--card); border-radius:28px; border:1.5px solid var(--outline); box-shadow:var(--e3); padding:24px 20px 12px; z-index:60; text-align:center; }
.dialog h3 { font-weight:900; font-size:22px; line-height:28px; margin-top:12px; }
.dialog p { font-weight:700; font-size:15px; line-height:21px; color:var(--soft); margin-top:8px; }
.sheetS { position:absolute; left:0; right:0; bottom:0; background:var(--sheet); border:1.5px solid var(--outline); border-bottom:0; border-radius:32px 32px 0 0; box-shadow:var(--sheetShadow), inset 0 1px 0 rgba(255,255,255,.55); z-index:60; }
.night .sheetS { box-shadow:var(--sheetShadow), inset 0 1px 0 rgba(255,255,255,.10); }
.grab { height:20px; position:relative; }
.grab i { position:absolute; top:8px; left:50%; width:36px; height:5px; margin-left:-18px; border-radius:3px; background:var(--card); }
.toast { position:absolute; left:16px; right:16px; height:52px; border-radius:16px; background:#1E1B16; color:#fff; display:flex; align-items:center; padding:0 8px 0 14px; gap:10px; font-weight:800; font-size:15px; box-shadow:var(--e2); z-index:50; }
.night .toast { background:#15142E; }

/* field */
.flabel { font-weight:900; font-size:12px; line-height:16px; letter-spacing:.8px; text-transform:uppercase; color:var(--soft); margin:18px 0 6px 4px; }

/* tree thumb (ThumbBox of the forest) */
.tb { position:relative; overflow:hidden; background:var(--skyCard); flex:none; }
.tb .gr { position:absolute; left:0; right:0; bottom:0; background:var(--meadowStrip); }
.tb img { position:absolute; left:50%; transform:translateX(-50%); filter:var(--treeFilter); }
.tb.locked { background:var(--warmSoft); display:flex; align-items:center; justify-content:center; }

/* NEW: the forest card of "Found a forest" (8.3) */
.fcard { display:flex; align-items:center; gap:14px; height:96px; padding:0 14px 0 10px; background:var(--card); border-radius:20px; box-shadow:var(--e1); position:relative; }
.fcard .t1 { font-weight:900; font-size:16px; line-height:21px; }
.fcard .t2 { font-weight:800; font-size:13px; line-height:18px; color:var(--soft); margin-top:2px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
.mini { position:relative; width:112px; height:76px; border-radius:16px; overflow:hidden; background:linear-gradient(#BFEAF6, #EAFBFF); flex:none; }
.night .mini { background:linear-gradient(#262B6E, #4C50A0); }
.mini .gr { position:absolute; left:0; right:0; bottom:0; height:20px; background:var(--meadowStrip); }
.mini img { position:absolute; filter:var(--treeFilter); }
.cnt { position:absolute; right:6px; top:6px; height:22px; border-radius:11px; background:var(--card); box-shadow:var(--e1); padding:0 8px; display:flex; align-items:center; gap:3px; font-weight:900; font-size:12.5px; }
.opt { display:flex; gap:12px; padding:14px 14px 14px 12px; border-radius:18px; background:var(--card); box-shadow:var(--e1); position:relative; align-items:flex-start; }
.opt.on { background:var(--pick); box-shadow:inset 0 0 0 2.5px var(--pickEdge), var(--e1); }
.radio { width:24px; height:24px; border-radius:12px; border:2.5px solid var(--muted); flex:none; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.opt.on .radio { border-color:var(--accent); }
.opt.on .radio::after { content:''; width:12px; height:12px; border-radius:6px; background:var(--accent); }
.opt .o1 { font-weight:900; font-size:16px; line-height:21px; display:flex; align-items:center; gap:8px; }
.opt .o2 { font-weight:700; font-size:13.5px; line-height:19px; color:var(--soft); margin-top:3px; }
.tag { font-weight:900; font-size:9.5px; line-height:12px; letter-spacing:.6px; text-transform:uppercase; padding:2px 6px; border-radius:8px; background:var(--accentSoft); color:var(--doneInk); flex:none; }

/* NEW: honest notes (8.4) */
.honest { display:flex; gap:12px; padding:14px 14px 14px 12px; border-radius:18px; background:var(--goldSoft); box-shadow:inset 0 0 0 1.5px var(--goldEdge); align-items:flex-start; }
.honest.green { background:var(--accentSoft); box-shadow:inset 0 0 0 1.5px rgba(76,199,100,.45); }
.honest .h1 { font-weight:900; font-size:15px; line-height:20px; }
.honest .h2 { font-weight:700; font-size:13.5px; line-height:19px; color:var(--soft); margin-top:3px; }
.way { display:flex; gap:12px; padding:14px 14px 14px 12px; border-radius:18px; background:var(--card); box-shadow:var(--e1); align-items:flex-start; }
.way .w1 { font-weight:900; font-size:15px; line-height:20px; }
.way .w2 { font-weight:700; font-size:13.5px; line-height:19px; color:var(--soft); margin-top:3px; }
.circ { width:40px; height:40px; border-radius:20px; display:flex; align-items:center; justify-content:center; flex:none; }

/* board */
.board { background:#FFF8EC; border-radius:24px; padding:24px; box-shadow:0 18px 40px rgba(60,40,10,.12); }
.board h3 { font-weight:900; font-size:18px; margin:18px 0 10px; color:#5A3A0E; }
.board h3:first-child { margin-top:0; }
.board .lbl { font-weight:800; font-size:12px; color:#6E6152; margin-top:6px; }
.board .two { display:flex; gap:24px; align-items:flex-start; }
.spin { animation:none; }

/* night: soft text on light-violet cards needs a lighter tone (спец 8.1, softOnCard) */
.card, .grp, .fcard, .way, .cardbg, .dialog { --soft:var(--softC); }
/* iOS keyboard (light), 336 incl. the home bar */
.kb { position:absolute; left:0; right:0; bottom:0; height:336px; background:#D1D4DA; z-index:85; padding:8px 3px 0; font-family:-apple-system,'SF Pro Text',system-ui,sans-serif; }
.kb .kr { display:flex; justify-content:center; gap:6px; margin-bottom:11px; }
.kb .k { height:42px; flex:0 0 31.5px; background:#fff; border-radius:5px; box-shadow:0 1px 0 #898A8D; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:400; color:#000; }
.kb .k.g { background:#ABB0BA; font-size:15px; }
.kb .k.go { background:#0A84FF; color:#fff; font-size:16px; }
.dim { opacity:.4; }
</style>
</head>
<body>
<div class="intro" id="intro">
  <h1>Лес в аккаунте — OYUUR-29</h1>
  <p>Кадры 375×812, день и ночь, по числам <b>спец.md</b> (рядом). Стиль, токены и детали — как в волне 5 (<code>design/волна-5/макет-друзья.html</code>). Деревья и главный экран — снимки из волны 5. Время — четверг 29 октября, 14:20. <code>?f=01</code> — один кадр без рамки.</p>
</div>
<div id="root"></div>

<script>
const IMGDIR = '../волна-5/img-друзья/';
// ===================== Glyphs (viewBox 24), copied from app/src/ui/ds/glyphs.tsx; NEW: vault =====================
const G = {

  acorn: `<ellipse cx="12" cy="14.6" rx="6.2" ry="7" fill="#C98A4B" stroke="#7A4E26" stroke-width="1.3"/><path d="M5 10.4 C5 6.6 8.2 5 12 5 C15.8 5 19 6.6 19 10.4 C19 11.4 18.2 12 17.2 12 H6.8 C5.8 12 5 11.4 5 10.4Z" fill="#8A5A2E" stroke="#5E3A1A" stroke-width="1.3"/><path d="M12 5 V2.6" stroke="#5E3A1A" stroke-width="1.6" stroke-linecap="round"/><path d="M9 15.2 A3 3 0 0 0 10.6 18.2" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".6"/>`,
  friends: `<circle cx="16.2" cy="7.6" r="3.2" fill="#BFE6FA" stroke="#2F86BE" stroke-width="1.2"/><path d="M10.6 19.6 C11 15.4 13.2 12.6 16.2 12.6 C19.6 12.6 22 15.2 22 19.6Z" fill="#7FC8F0" stroke="#2F86BE" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8.5" cy="8.6" r="3.6" fill="#FFD3A8" stroke="#C47F3E" stroke-width="1.2"/><path d="M2 20.2 C2 15.8 4.8 13.6 8.5 13.6 C12.2 13.6 15 15.8 15 20.2Z" fill="#FF9E5E" stroke="#C4652A" stroke-width="1.2" stroke-linejoin="round"/>`,
  sparkle: `<path d="M12 2 Q13.2 10.8 22 12 Q13.2 13.2 12 22 Q10.8 13.2 2 12 Q10.8 10.8 12 2Z" fill="#FFE27A" stroke="#D99A1E" stroke-width="1" stroke-linejoin="round"/>`,

// NEW glyph: the vault — a little wooden chest with a gold padlock ("hidden trees are locked in").
// open: 0 — shut, 1 — lid up and the shackle open (the moment before locking).
function vaultSvg(s, open = 0) {
  const lidRot = -30 * open, shackleUp = 2.2 * open;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="flex:none;display:block;overflow:visible">
    <ellipse cx="12" cy="21.4" rx="8.6" ry="1.5" fill="#C99A60" opacity=".55"/>
    <rect x="3.2" y="10.2" width="17.6" height="10.4" rx="2.2" fill="#C68A58" stroke="#7A4E26" stroke-width="1.3"/>
    <path d="M7.4 10.6 V20.4 M16.6 10.6 V20.4" stroke="#8A5A2E" stroke-width="1.4"/>
    <path d="M4.6 18.6 H19.4" stroke="#A8703F" stroke-width=".9" opacity=".7"/>
    <g transform="rotate(${lidRot} 3.2 10.4)">
      <path d="M3.2 10.6 V8.6 C3.2 5.7 6 4 12 4 C18 4 20.8 5.7 20.8 8.6 V10.6Z" fill="#B07A4E" stroke="#7A4E26" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M7.4 4.7 V10.4 M16.6 4.7 V10.4" stroke="#8A5A2E" stroke-width="1.4"/>
      <path d="M5.3 8.3 C6 6.8 7.6 6.1 9.4 5.9" stroke="#E3B98C" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 ${-shackleUp})"><path d="M10 11.4 V9.9 A2 2 0 0 1 14 9.9 V${11.4 - (open ? 1.6 : 0)}" fill="none" stroke="#B9801E" stroke-width="1.5" stroke-linecap="round"/></g>
    <rect x="8.8" y="11" width="6.4" height="5.6" rx="1.4" fill="#FFCF4D" stroke="#B9801E" stroke-width="1.1"/>
    <path d="M9.9 12.2 H11.2" stroke="#fff" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
    <circle cx="12" cy="13.4" r=".95" fill="#5A3A0E"/><path d="M12 13.8 V15.3" stroke="#5A3A0E" stroke-width="1" stroke-linecap="round"/>
  </svg>`;
}
// Line icons (viewBox 24). NEW: cloud, cloudCheck, cloudUp, cloudOff, key, code, phone.
const CLOUD = `<path d="M7 18.5 H17.2 A4.3 4.3 0 0 0 17.6 9.9 A5.8 5.8 0 0 0 6.4 11.3 A3.65 3.65 0 0 0 7 18.5Z"/>`;
const I = {
  chevronLeft: `<path d="M15 5 L8 12 L15 19"/>`, chevronRight: `<path d="M9 5 L16 12 L9 19"/>`,
  close: `<path d="M6 6 L18 18 M18 6 L6 18"/>`, check: `<path d="M5 12.5 L10 17 L19 7.5"/>`, plus: `<path d="M12 5 V19 M5 12 H19"/>`,
  lock: `<rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8 10.5 V8 A4 4 0 0 1 16 8 V10.5"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/>`,
  people: `<circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5 C3 15.8 5.6 13.8 9 13.8 C12.4 13.8 15 15.8 15 19.5"/><circle cx="16.6" cy="7.6" r="2.6"/><path d="M17.2 12.8 C19.6 13 21 15 21 18"/>`,
  eye: `<path d="M2.5 12 C5 7.5 8.3 5.5 12 5.5 C15.7 5.5 19 7.5 21.5 12 C19 16.5 15.7 18.5 12 18.5 C8.3 18.5 5 16.5 2.5 12Z"/><circle cx="12" cy="12" r="3"/>`,

const params = new URLSearchParams(location.search);
const only = params.get('f');
const root = document.getElementById('root');
function frameHtml(f) {
  if (f.board) return f.render();
  return `<div class="ph ${f.night ? 'night' : ''}" style="width:375px;height:812px">${f.render()}</div>`;
}
if (only) {
  document.body.classList.add('single');
  document.getElementById('intro').remove();
  const f = F.find((x) => x.id === only);
  root.innerHTML = `<div id="shot" style="display:inline-block">${frameHtml(f)}</div>`;
} else {
  let html = '', last = '';
  for (const f of F) {
    if (f.group !== last) { if (last) html += '</div>'; html += `<div class="group">${f.group}</div><div class="list">`; last = f.group; }
    html += `<div class="cell ${f.board ? 'wide' : ''}">${frameHtml(f)}<div class="cap"><b>${f.id}. ${f.title}</b><span>${f.sub}</span></div></div>`;
  }
  root.innerHTML = html + '</div>';
}
// Russian typography: no hanging short words at the end of a line, no line starting with a dash
// (the app does the same with a helper, спец 8.1).
(function tidy(node) {
  const SHORT = /(^|[\s«(])(в|и|с|к|у|о|а|я|на|по|до|из|за|не|от|ни|но|же|ли|бы|для|при|без|под|над|про|это|уже|все|всё|ещё|их|он|мы|ты|его|тот|там|как)\s/gi;
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  for (let t = walker.nextNode(); t; t = walker.nextNode()) {
    t.nodeValue = t.nodeValue.replace(SHORT, (m, a, w) => `${a}${w} `).replace(SHORT, (m, a, w) => `${a}${w} `).replace(/ —/g, ' —').replace(/(\d) (дн|деревь|изменен|скрыт)/g, '$1 $2');
  }
})(root);
window.FRAMES = F.map((f) => ({ id: f.id, file: f.file, board: !!f.board }));
