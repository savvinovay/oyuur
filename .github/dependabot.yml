version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # Expo packages move together with the SDK (npx expo install --fix), not one by one.
    groups:
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'jest-expo']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
